name: Publish development image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homeup-linux
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=dev-
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/dev/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Pin Dev Container to the published manifest
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/homeup-linux@${{ steps.build.outputs.digest }}
        run: |
          jq --arg image "$IMAGE" 'del(.build) | .image = $image' .devcontainer/devcontainer.json > /tmp/devcontainer.json
          mv /tmp/devcontainer.json .devcontainer/devcontainer.json
      - name: Open immutable-image update pull request
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: pin Dev Container image digest'
          title: 'chore: pin Dev Container image digest'
          body: 'Pins the Dev Container to the manifest produced by the image workflow.'
          branch: automation/pin-devcontainer-image
          delete-branch: true
          add-paths: .devcontainer/devcontainer.json
