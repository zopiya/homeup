name: Publish development image

on:
  push:
    branches: [main]
    paths-ignore:
      - .devcontainer/devcontainer.json
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homeup
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=dev-
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/dev/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Pin Dev Container to the published manifest
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/homeup@${{ steps.build.outputs.digest }}
        run: |
          jq --arg image "$IMAGE" 'del(.build) | .image = $image' .devcontainer/devcontainer.json > /tmp/devcontainer.json
          mv /tmp/devcontainer.json .devcontainer/devcontainer.json
      - name: Commit immutable image digest
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git diff --quiet -- .devcontainer/devcontainer.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .devcontainer/devcontainer.json
          git commit -m 'chore: pin Dev Container image digest'
          git push
