name: Check toolchain updates

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update lock from official immutable release metadata
        run: python3 scripts/ci/update-toolchain.py
      - name: Validate the updated lock and record metadata
        run: |
          scripts/ci/validate-lock.sh
          scripts/ci/check-toolchain-update.sh >toolchain/update-report.md
      - name: Commit updated lock directly to the default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git diff --quiet -- toolchain/lock.sh toolchain/update-report.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add toolchain/lock.sh toolchain/update-report.md
          git commit -m 'chore: update locked toolchain'
          git push
